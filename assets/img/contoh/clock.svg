<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect x="6" y="6" width="188" height="188" rx="22" fill="#FDF4FF" stroke="#1E293B" stroke-width="3"/>
  <!-- Alarm bells -->
  <circle cx="56" cy="54" r="18" fill="#F59E0B" stroke="#1E293B" stroke-width="3"/>
  <circle cx="144" cy="54" r="18" fill="#F59E0B" stroke="#1E293B" stroke-width="3"/>
  <!-- Stand Feet -->
  <line x1="64" y1="152" x2="52" y2="172" stroke="#1E293B" stroke-width="8" stroke-linecap="round"/>
  <line x1="136" y1="152" x2="148" y2="172" stroke="#1E293B" stroke-width="8" stroke-linecap="round"/>
  <!-- Clock Outer Rim -->
  <circle cx="100" cy="106" r="62" fill="#3B82F6" stroke="#1E293B" stroke-width="3.5"/>
  <!-- Clock Face -->
  <circle cx="100" cy="106" r="50" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
  <!-- Hour Marks -->
  <circle cx="100" cy="64" r="3" fill="#1E293B"/>
  <circle cx="142" cy="106" r="3" fill="#1E293B"/>
  <circle cx="100" cy="148" r="3" fill="#1E293B"/>
  <circle cx="58" cy="106" r="3" fill="#1E293B"/>
  <!-- Center Pin -->
  <circle cx="100" cy="106" r="4" fill="#EF4444"/>
  <!-- Hour Hand -->
  <line x1="100" y1="106" x2="124" y2="106" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  <!-- Minute Hand -->
  <line x1="100" y1="106" x2="100" y2="74" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
</svg>