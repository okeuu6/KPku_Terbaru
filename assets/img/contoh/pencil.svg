<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect x="6" y="6" width="188" height="188" rx="22" fill="#FFF7ED" stroke="#1E293B" stroke-width="3"/>
  <g transform="rotate(45 100 100)">
    <!-- Eraser -->
    <rect x="85" y="24" width="30" height="20" rx="6" fill="#F43F5E" stroke="#1E293B" stroke-width="3"/>
    <!-- Metal Band -->
    <rect x="84" y="42" width="32" height="14" fill="#E2E8F0" stroke="#1E293B" stroke-width="3"/>
    <!-- Pencil Body -->
    <rect x="85" y="56" width="30" height="84" fill="#FBBF24" stroke="#1E293B" stroke-width="3"/>
    <line x1="95" y1="56" x2="95" y2="140" stroke="#1E293B" stroke-width="2"/>
    <line x1="105" y1="56" x2="105" y2="140" stroke="#1E293B" stroke-width="2"/>
    <!-- Sharpened Wood -->
    <polygon points="85,140 115,140 100,172" fill="#FEF3C7" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
    <!-- Graphite Lead Tip -->
    <polygon points="95,160 105,160 100,172" fill="#1E293B"/>
  </g>
</svg>