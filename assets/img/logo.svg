<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Logo Media Belajar Inggris SD - KPKu (Human-Crafted & Ceria) -->
  <g id="logo-kpku">
    <!-- Rounded squircle badge with 3D bottom shadow -->
    <rect x="8" y="14" width="104" height="98" rx="26" fill="#1E293B"/>
    <rect x="8" y="8" width="104" height="98" rx="26" fill="#2563EB" stroke="#1E293B" stroke-width="4"/>

    <!-- Open Book -->
    <!-- Pages -->
    <path d="M22 46 C38 40, 56 42, 60 48 C64 42, 82 40, 98 46 L98 84 C82 78, 64 80, 60 86 C56 80, 38 78, 22 84 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Spine center line -->
    <line x1="60" y1="48" x2="60" y2="86" stroke="#1E293B" stroke-width="3.5"/>
    
    <!-- Red ribbon bookmark -->
    <path d="M60 48 L60 88 L65 84 L70 88 L70 48 Z" fill="#EF4444"/>

    <!-- Cheerful Lines of Knowledge / Letters -->
    <line x1="32" y1="58" x2="48" y2="56" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="68" x2="48" y2="66" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
    
    <line x1="72" y1="56" x2="88" y2="58" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="66" x2="88" y2="68" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>

    <!-- Smiling Star leaping from the book! -->
    <g transform="translate(60, 26) scale(0.48) translate(-50, -50)">
      <path d="M50 8 L61 34 L89 36 L67 54 L74 82 L50 67 L26 82 L33 54 L11 36 L39 34 Z" fill="#FBBF24" stroke="#1E293B" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="41" cy="46" r="4" fill="#1E293B"/>
      <circle cx="59" cy="46" r="4" fill="#1E293B"/>
      <path d="M47 52 C50 56 52 56 55 52" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Mini sparkles -->
    <circle cx="28" cy="24" r="3" fill="#FACC15"/>
    <circle cx="94" cy="26" r="2.5" fill="#FACC15"/>
  </g>
</svg>