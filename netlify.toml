[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/siswa/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/guru/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kepsek/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/operator/*"
  to = "/index.html"
  status = 200
